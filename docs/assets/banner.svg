<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05020A"/>
      <stop offset="50%" stop-color="#0D071B"/>
      <stop offset="100%" stop-color="#140B2A"/>
    </linearGradient>

    <!-- Nebula Glows -->
    <radialGradient id="nebulaPurple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#4C1D95" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#05020A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaCyan" cx="80%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0E7490" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#05020A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#DC2626" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#05020A" stop-opacity="0"/>
    </radialGradient>

    <!-- Celestial Sphere Gradients -->
    <radialGradient id="planetMars" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="45%" stop-color="#DC2626"/>
      <stop offset="85%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </radialGradient>
    <radialGradient id="planetSaturn" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="80%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#713F12"/>
    </radialGradient>
    <radialGradient id="planetEarth" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="80%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#082F49"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C3AED" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#nebulaPurple)"/>
  <rect width="1200" height="420" fill="url(#nebulaCyan)"/>

  <!-- Starfield (Procedural vector stars) -->
  <g fill="#FFFFFF">
    <circle cx="85" cy="45" r="1.2" opacity="0.8"/>
    <circle cx="160" cy="110" r="0.8" opacity="0.5"/>
    <circle cx="230" cy="65" r="1.6" opacity="0.9"/>
    <circle cx="310" cy="160" r="1.0" opacity="0.6"/>
    <circle cx="420" cy="40" r="1.4" opacity="0.7"/>
    <circle cx="510" cy="120" r="0.9" opacity="0.4"/>
    <circle cx="640" cy="70" r="1.5" opacity="0.8"/>
    <circle cx="750" cy="130" r="1.1" opacity="0.5"/>
    <circle cx="820" cy="50" r="1.7" opacity="0.9"/>
    <circle cx="910" cy="100" r="0.8" opacity="0.4"/>
    <circle cx="1020" cy="45" r="1.3" opacity="0.8"/>
    <circle cx="1110" cy="120" r="1.5" opacity="0.7"/>

    <circle cx="95" cy="280" r="1.5" opacity="0.7"/>
    <circle cx="175" cy="360" r="1.0" opacity="0.6"/>
    <circle cx="280" cy="310" r="1.3" opacity="0.5"/>
    <circle cx="390" cy="370" r="0.8" opacity="0.4"/>
    <circle cx="480" cy="290" r="1.6" opacity="0.9"/>
    <circle cx="590" cy="350" r="1.1" opacity="0.6"/>
    <circle cx="710" cy="380" r="1.4" opacity="0.7"/>
    <circle cx="830" cy="320" r="0.9" opacity="0.5"/>
    <circle cx="950" cy="360" r="1.5" opacity="0.8"/>
    <circle cx="1060" cy="290" r="1.0" opacity="0.6"/>
    <circle cx="1140" cy="350" r="1.6" opacity="0.9"/>
  </g>

  <!-- Constellation Accent Lines -->
  <path d="M 230 65 L 310 160 L 420 40" stroke="#7C3AED" stroke-width="0.7" stroke-dasharray="3 3" opacity="0.4" fill="none"/>
  <path d="M 820 50 L 910 100 L 1020 45" stroke="#06B6D4" stroke-width="0.7" stroke-dasharray="3 3" opacity="0.4" fill="none"/>

  <!-- Orbital Trajectory Rings -->
  <ellipse cx="600" cy="230" rx="550" ry="170" stroke="url(#orbitGrad)" stroke-width="1.4" fill="none" transform="rotate(-7 600 230)"/>
  <ellipse cx="600" cy="230" rx="420" ry="120" stroke="url(#orbitGrad)" stroke-width="1.0" stroke-dasharray="6 4" fill="none" opacity="0.7" transform="rotate(-4 600 230)"/>
  <ellipse cx="600" cy="230" rx="280" ry="75" stroke="#7C3AED" stroke-width="0.8" opacity="0.35" fill="none" transform="rotate(-2 600 230)"/>

  <!-- Celestial Bodies -->
  <!-- Deep Space Sun (Far Upper Left Glow) -->
  <circle cx="50" cy="30" r="140" fill="url(#sunGlow)"/>

  <!-- Earth with Atmosphere Glow -->
  <g transform="translate(180, 220)">
    <circle cx="0" cy="0" r="32" fill="#06B6D4" opacity="0.25" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="28" fill="url(#planetEarth)"/>
    <!-- Atmosphere Cloud Swirl -->
    <path d="M -16 -12 Q 0 -5 16 -16 Q 22 2 12 16 Q -5 18 -18 8 Z" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="10" cy="-6" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Mars (Red Planet) -->
  <g transform="translate(1010, 130)">
    <circle cx="0" cy="0" r="26" fill="#EF4444" opacity="0.3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="22" fill="url(#planetMars)"/>
    <!-- Polar Ice Cap -->
    <ellipse cx="0" cy="-18" rx="7" ry="2.5" fill="#FEF2F2" opacity="0.85"/>
  </g>

  <!-- Saturn with Rings (Lower Right) -->
  <g transform="translate(1060, 310)">
    <!-- Back Ring Segment -->
    <ellipse cx="0" cy="0" rx="55" ry="14" stroke="#D97706" stroke-width="4.5" opacity="0.4" fill="none" transform="rotate(-18)"/>
    <ellipse cx="0" cy="0" rx="46" ry="11" stroke="#FEF08A" stroke-width="2.5" opacity="0.6" fill="none" transform="rotate(-18)"/>
    <!-- Planet Body -->
    <circle cx="0" cy="0" r="22" fill="url(#planetSaturn)"/>
    <!-- Front Ring Segment -->
    <path d="M -52 17 C -30 25 30 5 52 -17" stroke="#FEF08A" stroke-width="4" fill="none" opacity="0.85"/>
  </g>

  <!-- Central Brand Presentation -->
  <g transform="translate(600, 115)">
    <!-- NASA Space Apps Tag Badge -->
    <g transform="translate(0, 0)">
      <rect x="-175" y="0" width="350" height="30" rx="15" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2" opacity="0.9"/>
      <circle cx="-150" cy="15" r="4" fill="#22D3EE" filter="url(#glow)"/>
      <text x="10" y="20" fill="#E0E7FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" text-anchor="middle">
        NASA SPACE APPS CHALLENGE
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', Helvetica, Arial, sans-serif" font-size="62" font-weight="900" letter-spacing="4" text-anchor="middle" filter="url(#glow)">
      BEYOND EARTH
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="122" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1.5" text-anchor="middle">
      Interactive Deep Space Exploration &amp; Robotic Museum
    </text>

    <!-- Supporting Narrative -->
    <text x="0" y="152" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0.4" text-anchor="middle">
      Chronicle of 60+ Years of Human-Made Spacecraft, Rovers &amp; Orbiters Across the Solar System
    </text>

    <!-- Feature Attribute Badges Bar -->
    <g transform="translate(0, 195)">
      <!-- Badge 1: 3D Engine -->
      <g transform="translate(-320, 0)">
        <rect x="0" y="0" width="150" height="32" rx="10" fill="#0F172A" stroke="#7C3AED" stroke-width="1" opacity="0.95"/>
        <text x="75" y="20" fill="#C4B5FD" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">🪐 3D WebGL Engine</text>
      </g>

      <!-- Badge 2: NASA Fleet -->
      <g transform="translate(-155, 0)">
        <rect x="0" y="0" width="150" height="32" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1" opacity="0.95"/>
        <text x="75" y="20" fill="#67E8F9" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">🛰️ 18 Spacecraft</text>
      </g>

      <!-- Badge 3: Flight Milestones -->
      <g transform="translate(10, 0)">
        <rect x="0" y="0" width="150" height="32" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1" opacity="0.95"/>
        <text x="75" y="20" fill="#FCD34D" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">📜 68 Milestones</text>
      </g>

      <!-- Badge 4: WCAG 2.1 AA -->
      <g transform="translate(175, 0)">
        <rect x="0" y="0" width="150" height="32" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1" opacity="0.95"/>
        <text x="75" y="20" fill="#6EE7B7" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">♿ WCAG 2.1 AA</text>
      </g>
    </g>
  </g>
</svg>
